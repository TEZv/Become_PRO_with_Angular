<section class="work-experience__section">
  <div class="work-experience__h4-container">
    <h4>{{ experienceInfo.title }}</h4>
    <button class="work-experience__btn">{{ experienceInfo.workType }}</button>
  </div>
  <div class="work-experience__div-outer">
    <div class="work-experience__div-project-location">
      <p>
        <img src="../../assets/experience-info/grid.svg" />
        {{ experienceInfo.project }}
      </p>
      <p *ngIf="experienceInfo.location" class="work-experience__p-location">
        <img src="../../assets/experience-info/location.svg" />
        {{ experienceInfo.location }}
      </p>
    </div>
    <p>
      <img src="../../assets/experience-info/calendar.svg" />
      {{ experienceInfo.startDate | date }} -
      {{ experienceInfo.endDate | date }}
    </p>
  </div>
</section>
<div class="work-experience__line-below"></div>
