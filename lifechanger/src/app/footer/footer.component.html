<footer class="footer">
  <div class="footer__container">
    <div class="footer__logo">
      <a href="index.html">
        <img
          src="../../assets/footer/logo-footer.jpg"
          alt="Oksana's Kolisnyk logo image"
          class="footer__image"
        />
      </a>
    </div>
    <div class="footer__nav-primary">
      <div class="footer__primary">
        <ul class="footer__links footer__container-link">
          <li>
            <a
              href="tel:+380931591080"
              class="footer__links-link footer__links-link-phone"
              >+380 93 159 1080</a
            >
          </li>
          <li>
            <a
              href="mailto:zazera777@gmail.com"
              class="footer__links-link footer__links-link-mail"
              >zazera777&#64;gmail.com</a
            >
          </li>
        </ul>
        <div>
          <ul class="footer__nav-logos">
            <li>
              <a href="https://github.com/TEZv" class="footer__link">
                <img
                  [src]="githubSvgSource"
                  alt="Github platform logo image"
                  class="footer__image"
                />
              </a>
            </li>
            <li>
              <a href="https://t.me/kosatik" class="footer__link">
                <img
                  [src]="telegramSvgSource"
                  alt="Telegram messenger logo image"
                  class="footer__image"
                />
              </a>
            </li>
            <li>
              <a
                href="https://www.linkedin.com/in/oksana-kolisnyk-0b9632247"
                class="footer__link"
              >
                <img
                  [src]="linkedInSvgSource"
                  alt="LinkedIn social media logo image"
                  class="footer__image"
                />
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <img
    src="../../assets/footer/line-image.svg"
    alt="The image of gray vertical bold line"
  />
  <div class="footer__container footer__nav-container">
    <div class="footer__primary">
      <div class="footer__links">
        <button class="footer__links-button" (click)="showForm()">Contact Me</button>
        <a
          [routerLink]="['/blog']"
          [target]="linkTarget"
          class="footer__links-link footer__links-link-blog"
          >Blog</a
        >
      </div>
    </div>
    <p>
      Designed and built by <span>Oksana Kolisnyk & Ruslan Dzobko</span> with
      <span>Love</span> / <span>Coffee</span>
    </p>
  </div>

  <!-- Contact Form Modal -->
  <div *ngIf="isFormVisible" class="form-overlay">
    <div class="form-container">
      <form (ngSubmit)="onSubmit()" [formGroup]="contactForm">
        <div class="form-group">
          <label for="name">Name:</label>
          <input
            type="text"
            id="name"
            formControlName="name"
            placeholder="Your name"
            [ngClass]="{ 'is-invalid': isSubmitted && formControls['name'].errors }"
          />
          <div *ngIf="isSubmitted && formControls['name'].errors" class="invalid-feedback">
            <div *ngIf="formControls['name'].errors['required']">Name is required</div>
            <div *ngIf="formControls['name'].errors['pattern']">Invalid name format</div>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="Your email"
            [ngClass]="{ 'is-invalid': isSubmitted && formControls['email'].errors }"
          />
          <div *ngIf="isSubmitted && formControls['email'].errors" class="invalid-feedback">
            <div *ngIf="formControls['email'].errors['required']">Email is required</div>
            <div *ngIf="formControls['email'].errors['pattern']">Invalid email format</div>
          </div>
        </div>

        <div class="form-group">
          <label for="message">Message:</label>
          <textarea
            id="message"
            formControlName="message"
            placeholder="Your message"
            [ngClass]="{ 'is-invalid': isSubmitted && formControls['message'].errors }"
          ></textarea>
          <div *ngIf="isSubmitted && formControls['message'].errors" class="invalid-feedback">
            <div *ngIf="formControls['message'].errors['required']">Message is required</div>
            <div *ngIf="formControls['message'].errors['minlength']">
              Message must be at least 10 characters
            </div>
          </div>
        </div>

        <div class="form-buttons">
          <button type="submit" class="submit-button">Submit</button>
          <button type="button" class="cancel-button" (click)="hideForm()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</footer>
